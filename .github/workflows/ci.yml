name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python scripts/generate_data.py
      - run: python scripts/geo_power.py
      # two SCALE channels compete for budget only at a higher margin: keeps the allocation test meaningful
      - run: "dbt build --profiles-dir . --target duckdb --vars '{gross_margin: 0.75}'"
      # the sensitivity check in docs/methodology.md: every model must follow a shorter value horizon
      - run: "dbt build --profiles-dir . --target duckdb --vars '{value_horizon_days: 90}'"
      - run: dbt build --profiles-dir . --target duckdb
      - run: python scripts/report.py
      # one corruption per raw feed at a time; the build must stop every one (about 40 builds)
      - run: python scripts/poison_check.py
