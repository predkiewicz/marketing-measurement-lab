name: measurement_lab
version: "0.1.0"
profile: measurement_lab
config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  lookback_days: 30          # touchpoints older than this before the order get no credit
  injection_threshold_s: 10  # click less than this many seconds before an order is suspicious
  affiliate_fee: 0.10        # affiliate commission, share of attributed revenue (matches generate_data.py)
  geo_test_start: "2026-06-01"  # first day the campaign runs in the treatment regions
  geo_ci_z: 1.96             # 95% interval for the geo test readout
  incrementality_threshold: 0.5  # verdict line: interval wholly below = mostly claims existing demand, wholly above = mostly incremental
  holdout_planted_incrementality:  # planted by generate_data.py (HOLDOUT_INCREMENTALITY); only the tests use it
    paid_social: 0.85
    display: 0.60
    paid_search: 0.45
    affiliate: 0.15
  geo_planted_lift: 0.08     # true effect planted by generate_data.py (GEO_LIFT); only the tests use it

seeds:
  measurement_lab:
    raw_touchpoints:
      +column_types: {touch_ts: timestamp}
    raw_orders:
      +column_types: {order_ts: timestamp}
    raw_ad_spend:
      +column_types: {spend_date: date}
    raw_geo_daily:
      +column_types: {geo_date: date}
    raw_holdout_daily:
      +column_types: {holdout_date: date}

models:
  measurement_lab:
    staging:
      +materialized: view
    marts:
      +materialized: table
    qa:
      +materialized: view
